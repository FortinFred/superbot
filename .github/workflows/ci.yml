name: CI

# Build and test the server on every push and pull request.
# Only first-party actions are used (pinned to a commit), so the workflow runs
# in locked-down CI without reaching third-party marketplaces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Rust version
        run: cargo --version && rustc --version

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Test
        run: cargo test --locked
